version: '3.8'

services:
  openapi-to-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openapi-to-mcp-generator
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - OUTPUT_DIR=/app/output
      - WORKERS=${WORKERS:-2}
      - THREADS=${THREADS:-4}
    volumes:
      # Persist generated servers
      - mcp-output:/app/output
      # Optional: Mount local output directory
      # - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mcp-output:
    driver: local

