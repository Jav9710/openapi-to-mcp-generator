# Configuración batch para generar múltiples servidores MCP
# Ejemplo de configuración para microservicios empresariales

output_dir: ./output

# Configuración global aplicada a todos los servicios
global:
  environment: production
  log_level: INFO
  enable_tracing: true
  correlation_id_header: X-Correlation-ID

# Lista de microservicios a procesar
services:
  - name: user_management
    spec: ./user-management-api.yaml
    prefix: users
    base_url: https://api.enterprise.com/v2
    environment: production
    auth:
      type: bearer
      token_env: USER_API_TOKEN

