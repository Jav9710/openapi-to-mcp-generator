[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openapi-to-mcp"
version = "1.0.0"
description = "Generador automático de servidores MCP a partir de especificaciones OpenAPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Enterprise Team", email = "team@enterprise.com" }
]
keywords = ["mcp", "openapi", "llm", "ai", "microservices", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "openapi-spec-validator>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
interactive = [
    "questionary>=2.0.0",
]
gui = [
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-bcrypt>=1.0.0",
    "flask-socketio>=5.3.0",
    "requests>=2.31.0",
    "gunicorn>=21.0.0",
    "cryptography>=41.0.0",
]
all = [
    "questionary>=2.0.0",
    "flask>=3.0.0",
    "flask-login>=0.6.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-bcrypt>=1.0.0",
    "flask-socketio>=5.3.0",
    "requests>=2.31.0",
    "gunicorn>=21.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
openapi-to-mcp = "openapi_to_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/enterprise/openapi-to-mcp"
Documentation = "https://github.com/enterprise/openapi-to-mcp#readme"
Repository = "https://github.com/enterprise/openapi-to-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_to_mcp"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
