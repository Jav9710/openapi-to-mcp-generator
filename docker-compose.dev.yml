version: '3.8'

# Development services for OpenAPI to MCP Generator
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL - Base de datos relacional
  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    environment:
      POSTGRES_USER: openapi_mcp
      POSTGRES_PASSWORD: development
      POSTGRES_DB: openapi_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openapi_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache y message broker
  redis:
    image: redis:7-alpine
    container_name: mcp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Almacenamiento de artefactos (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: mcp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO client - Crea buckets iniciales
  minio-init:
    image: minio/mc:latest
    container_name: mcp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/openapi-specs --ignore-existing;
      mc mb myminio/mcp-artifacts --ignore-existing;
      mc mb myminio/reports --ignore-existing;
      mc mb myminio/backups --ignore-existing;
      echo 'Buckets created successfully';
      "

  # Ollama - LLM local
  ollama:
    image: ollama/ollama:latest
    container_name: mcp-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB (optional - uncomment if needed)
  # mongodb:
  #   image: mongo:7
  #   container_name: mcp-mongodb
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: openapi_mcp
  #     MONGO_INITDB_ROOT_PASSWORD: development
  #   ports:
  #     - "27017:27017"
  #   volumes:
  #     - mongodb_data:/data/db

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  # mongodb_data:
